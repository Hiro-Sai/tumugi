# =========================================
# /api だけを公開する。
# tumugi_server の includes/・sql/・tools/ は URL から到達できない
# （.htaccess に頼らず、そもそも公開しない）。
# =========================================
<VirtualHost *:80>
    # 中身のない DocumentRoot。/api 以外の URL では何も公開しない（404 または 403 になる）
    DocumentRoot /var/www/empty
    <Directory /var/www/empty>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /api /var/www/tumugi/api
    <Directory /var/www/tumugi/api>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
