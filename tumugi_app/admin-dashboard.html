<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 読み込めるものをアプリのフォルダの中だけに制限する（画面側からの通信はすべて禁止） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>つむぎ 管理者ダッシュボード</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap {
      position: relative;
      z-index: 1;
      height: 100vh;
      overflow-y: auto;
      padding: 32px 40px 60px;
    }
    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .admin-title {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      color: var(--amber-pale);
      letter-spacing: 0.1em;
      text-shadow: 0 0 20px rgba(232,176,106,0.3);
    }
    .admin-back-btn {
      background: none;
      border: 1px solid rgba(237,224,200,0.15);
      color: var(--cream-dim);
      font-family: var(--font-jp);
      font-size: 12px;
      padding: 8px 18px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
      opacity: 0.7;
    }
    .admin-back-btn:hover:not(:disabled) { opacity: 1; background: rgba(237,224,200,0.08); }
    .admin-back-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .admin-note {
      font-size: 12px;
      color: var(--cream-dim);
      opacity: 0.8;
      font-family: var(--font-jp);
      line-height: 1.8;
      padding: 14px 18px;
      border: 1px solid var(--divider);
      border-radius: var(--radius-sm);
      background: rgba(43,32,24,0.025);
      margin-bottom: 20px;
    }

    .admin-card {
      background: #FFFFFF;
      border: 1px solid var(--divider);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 2px 14px rgba(43,32,24,0.05);
    }

    .admin-card-title {
      font-size: 11px;
      letter-spacing: 0.15em;
      color: var(--amber-dim);
      opacity: 0.8;
      font-family: var(--font-jp);
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    #chartCanvas, #harassmentChartCanvas {
      width: 100%;
      height: 260px;
      display: block;
    }

    .chart-legend {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 10px;
      font-size: 11px;
      font-family: var(--font-jp);
      color: var(--cream-dim);
      opacity: 0.75;
    }
    .legend-dot {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }
    .legend-dot-dept    { background: linear-gradient(135deg, var(--amber-glow), var(--amber-dim)); }
    .legend-dot-newgrad { background: linear-gradient(135deg, #5a9bd4, #3f6f99); }

    .new-grad-badge {
      display: inline-block;
      font-size: 9.5px;
      padding: 1px 7px;
      border-radius: var(--radius-full);
      background: rgba(63,111,153,0.12);
      color: #3F6F99;
      margin-left: 6px;
      letter-spacing: 0.03em;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-jp);
      font-size: 12.5px;
    }
    .admin-table th, .admin-table td {
      text-align: left;
      padding: 10px 14px;
      border-bottom: 1px solid var(--divider);
    }
    .admin-table th {
      color: var(--amber-dim);
      font-weight: 400;
      letter-spacing: 0.06em;
      font-size: 11px;
      opacity: 0.85;
    }
    .admin-table td { color: var(--cream); }
    .admin-table .crisis-cell { color: #B23A2A; font-weight: 500; }

    .admin-loading, .admin-error {
      text-align: center;
      color: var(--cream-dim);
      opacity: 0.7;
      font-family: var(--font-jp);
      font-size: 12.5px;
      padding: 40px 0;
    }
    .admin-error { color: #B23A2A; opacity: 0.9; }

    .harassment-flag-note {
      font-size: 12px;
      color: #A8631E;
      font-family: var(--font-jp);
      line-height: 1.7;
      padding: 10px 14px;
      border: 1px solid rgba(168,99,30,0.25);
      border-radius: var(--radius-sm);
      background: rgba(168,99,30,0.06);
      margin-bottom: 8px;
    }

    /* ---------- タブ（集計／社員） ---------- */
    .admin-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 22px;
    }
    .admin-tab {
      background: none;
      border: 1px solid rgba(43,32,24,0.12);
      color: var(--cream-dim);
      font-family: var(--font-jp);
      font-size: 12.5px;
      padding: 7px 22px;
      border-radius: var(--radius-full);
      cursor: pointer;
      transition: var(--transition);
    }
    .admin-tab:hover:not(:disabled):not(.on) { background: rgba(201,122,61,0.08); }
    .admin-tab.on {
      background: var(--amber-glow);
      border-color: var(--amber-glow);
      color: #FFFFFF;
      cursor: default;
    }
    .admin-tab:disabled:not(.on) { opacity: 0.45; cursor: not-allowed; }

    /* ---------- 「社員」タブ：左に一覧、右に詳しい欄 ---------- */
    .emp-panel {
      display: flex;
      gap: 20px;
      align-items: flex-start;
      font-family: var(--font-jp);
    }
    /* display を指定した要素でも hidden が効くようにする */
    .emp-panel[hidden], .emp-panel [hidden], .admin-tab[hidden] { display: none; }

    .emp-side { flex: 1.3 1 0; min-width: 0; }
    .emp-bar {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }
    .emp-bar .emp-input { flex: 1; min-width: 0; }

    .emp-input {
      width: 100%;
      background: rgba(201,122,61,0.05);
      border: 1px solid rgba(201,122,61,0.25);
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      color: var(--cream);
      font-family: var(--font-jp);
      font-size: 12.5px;
      outline: none;
      transition: var(--transition);
    }
    .emp-input::placeholder { color: rgba(107,90,74,0.45); }
    .emp-input:focus {
      border-color: rgba(201,122,61,0.5);
      background: rgba(201,122,61,0.09);
      box-shadow: 0 0 0 3px rgba(201,122,61,0.1);
    }
    .emp-input:disabled { opacity: 0.5; cursor: not-allowed; }

    .emp-btn {
      background: var(--amber-glow);
      border: 1px solid var(--amber-glow);
      color: #FFFFFF;
      font-family: var(--font-jp);
      font-size: 12px;
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }
    .emp-btn:hover:not(:disabled) { background: var(--amber-bright); border-color: var(--amber-bright); }
    .emp-btn.sub {
      background: #FFFFFF;
      border-color: rgba(168,99,30,0.4);
      color: var(--amber-pale);
    }
    .emp-btn.sub:hover:not(:disabled) { background: rgba(201,122,61,0.08); border-color: rgba(168,99,30,0.4); }
    .emp-btn.warn {
      background: #FFFFFF;
      border-color: rgba(170,51,51,0.4);
      color: #AA3333;
    }
    .emp-btn.warn:hover:not(:disabled) { background: rgba(170,51,51,0.06); border-color: rgba(170,51,51,0.4); }
    .emp-btn.danger { background: #BB3333; border-color: #BB3333; }
    .emp-btn.danger:hover:not(:disabled) { background: #9E2A2A; border-color: #9E2A2A; }
    .emp-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* 一覧 */
    .emp-list-card { padding: 6px 10px; margin-bottom: 0; }
    /* 一覧全体を1つのグリッドにし、どの行も同じ列の幅を使う（札の有無で部署の位置がずれないように） */
    .emp-list {
      display: grid;
      grid-template-columns: 58px minmax(0, 1.2fr) minmax(0, 1fr) max-content;
      column-gap: 10px;
      align-content: start;
      max-height: calc(100vh - 270px);
      min-height: 120px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(184,115,51,0.25) transparent;
    }
    .emp-list.locked .emp-row { cursor: not-allowed; }
    .emp-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: subgrid;
      align-items: center;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      border-bottom: 1px solid var(--divider);
      padding: 9px 8px;
      font-family: var(--font-jp);
      font-size: 12.5px;
      color: var(--cream);
      cursor: pointer;
    }
    .emp-row:last-child { border-bottom: none; }
    .emp-row:hover { background: rgba(201,122,61,0.06); }
    .emp-row.sel { background: rgba(201,122,61,0.12); border-radius: 4px; }
    .emp-row.off { color: #A09080; }
    .emp-id { font-family: var(--font-body); }
    .emp-name, .emp-dept {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .emp-tags { display: flex; gap: 4px; justify-content: flex-end; }
    .emp-tag {
      display: inline-block;
      font-size: 9.5px;
      padding: 1px 7px;
      border-radius: var(--radius-full);
      white-space: nowrap;
      letter-spacing: 0.03em;
    }
    .emp-tag.grad { background: rgba(63,111,153,0.12); color: #3F6F99; }
    .emp-tag.adm  { background: rgba(168,99,30,0.12); color: #A8631E; }
    .emp-tag.off  { background: rgba(43,32,24,0.08); color: #8A7A6A; }
    .emp-tag.temp { border: 1px dashed rgba(168,99,30,0.5); color: #A8631E; padding: 0 6px; }
    .emp-list-note {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--cream-dim);
      font-size: 12.5px;
      padding: 28px 0;
      line-height: 1.8;
    }
    .emp-list-note.error { color: #B23A2A; }
    .emp-list-note .emp-btn { margin-top: 10px; }

    /* 右の詳しい欄 */
    .emp-detail {
      flex: 1 1 0;
      min-width: 0;
      margin-bottom: 0;
      position: sticky;
      top: 16px;
      font-size: 12.5px;
      color: var(--cream);
    }
    .emp-title { font-weight: 700; font-size: 14px; margin-bottom: 14px; line-height: 1.6; word-break: break-all; }
    .emp-empty { color: var(--cream-dim); text-align: center; padding: 28px 0; }
    .emp-field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .emp-label { font-size: 10.5px; letter-spacing: 0.1em; color: var(--amber-dim); opacity: 0.85; }
    .emp-fixed { font-family: var(--font-body); }
    .emp-checks { display: flex; flex-wrap: wrap; gap: 6px 20px; margin-bottom: 14px; }
    .emp-check { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .emp-check input { accent-color: var(--amber-glow); }
    .emp-hint { font-size: 11px; color: var(--cream-dim); }
    .emp-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .emp-actions.right { justify-content: flex-end; }
    .emp-actions.spaced { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--divider); }
    .emp-note { font-size: 11.5px; color: var(--cream-dim); line-height: 1.8; margin-top: 10px; }
    .emp-alert {
      background: rgba(170,51,51,0.06);
      border: 1px solid rgba(170,51,51,0.25);
      color: #7A2A2A;
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12px;
      line-height: 1.8;
      margin-bottom: 14px;
    }
    .emp-pw {
      font-family: 'DM Sans', Consolas, monospace;
      font-size: 22px;
      letter-spacing: 0.12em;
      background: var(--bg-deep);
      border: 1px dashed rgba(168,99,30,0.5);
      border-radius: var(--radius-sm);
      padding: 12px 8px;
      text-align: center;
      margin: 10px 0;
      user-select: all;
      word-break: break-all;
    }
    .emp-msg { font-size: 12px; line-height: 1.7; margin: 0 0 12px; }
    .emp-msg.error { color: #B23A2A; }
    .emp-msg.ok { color: #2E8B57; }
  </style>
</head>
<body>

  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>
  <div class="bg-noise"></div>

  <div class="admin-wrap">
    <div class="admin-header">
      <span class="admin-title">管理者ダッシュボード</span>
      <button id="adminBackBtn" class="admin-back-btn">← チャットに戻る</button>
    </div>

    <!-- 「社員」タブは、展示モードでは出さない（admin-dashboard.js が、確かめてから出す） -->
    <div class="admin-tabs" role="tablist">
      <button type="button" id="tabSummaryBtn" class="admin-tab on" role="tab" aria-selected="true" aria-controls="adminContent">集計</button>
      <button type="button" id="tabEmployeesBtn" class="admin-tab" role="tab" aria-selected="false" aria-controls="employeesPanel" hidden>社員</button>
    </div>

    <div id="adminContent" role="tabpanel">
      <p class="admin-loading">読み込み中…</p>
    </div>

    <div id="employeesPanel" class="emp-panel" role="tabpanel" hidden>
      <div class="emp-side">
        <div class="emp-bar">
          <input type="text" id="employeeSearch" class="emp-input" placeholder="社員ID・名前で探す" autocomplete="off" spellcheck="false">
          <button type="button" id="employeeNewBtn" class="emp-btn">＋ 新しい社員</button>
        </div>
        <div class="admin-card emp-list-card">
          <div id="employeeList" class="emp-list"></div>
        </div>
      </div>
      <div id="employeeDetail" class="admin-card emp-detail"></div>
    </div>
  </div>

  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/employee-rules.js"></script>
  <script src="js/admin-employees.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
