<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 読み込めるものをアプリのフォルダの中だけに制限する（画面側からの通信はすべて禁止） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>つむぎ ログイン</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="bg-overlay"></div>
  <div class="bg-vignette"></div>
  <div class="bg-noise"></div>

  <div style="position:relative; z-index:1; min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="setup-card">
      <p class="setup-sub">empathy AI</p>
      <h2 class="setup-title">つむぎ</h2>
      <p class="setup-desc">社員IDとパスワードでログインしてください</p>

      <div class="setup-fields">
        <div class="setup-field">
          <label class="setup-label">社員ID</label>
          <input type="text" id="loginEmployeeCode" class="setup-input" placeholder="E001" autocomplete="username">
        </div>
        <div class="setup-field">
          <label class="setup-label">パスワード</label>
          <input type="password" id="loginPassword" class="setup-input" placeholder="••••••••" autocomplete="current-password">
        </div>
      </div>

      <p id="loginError" style="color:#B23A2A; font-size:11.5px; font-family:'Noto Sans JP',sans-serif; opacity:0.9; margin-bottom:14px; min-height:1.2em; text-align:center;"></p>

      <button class="setup-btn" id="loginSubmitBtn">ログイン</button>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
