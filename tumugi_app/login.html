<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- 読み込めるものをアプリのフォルダの中だけに制限する（画面側からの通信はすべて禁止） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>つむぎ ログイン</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-login">

  <div class="login">
    <!-- 左：立ち絵（飾り）と、つむぎの説明 -->
    <div class="login-side">
      <div class="figure"><img src="images/normal_open.png" alt=""></div>
      <h1>つむぎ</h1>
      <p>仕事や気持ちについて、<br>何でも話せる相手です。</p>
    </div>

    <!-- 右：入力 -->
    <div class="login-form">

      <!-- 1段目：社員IDとパスワードでログインする -->
      <div id="loginStep" class="login-step">
        <h2>ログイン</h2>
        <div class="field">
          <label for="loginEmployeeCode">社員ID</label>
          <input type="text" id="loginEmployeeCode" autocomplete="username">
        </div>
        <div class="field">
          <label for="loginPassword">パスワード</label>
          <input type="password" id="loginPassword" autocomplete="current-password">
          <span class="hint">パスワードを忘れた場合は、管理者に連絡すると、仮のパスワードが発行されます。</span>
        </div>
        <p id="loginError" class="login-error" role="alert"></p>
        <button class="btn" id="loginSubmitBtn">ログイン</button>
      </div>

      <!-- 2段目：仮のパスワードでログインしたとき、新しいパスワードを決める（初めは隠しておく） -->
      <div id="passwordChangeStep" class="login-step" hidden>
        <h2>新しいパスワードの設定</h2>
        <p>管理者から伝えられた仮のパスワードを、新しいパスワードに変更してください。</p>
        <div class="field">
          <label for="firstNewPassword">新しいパスワード</label>
          <input type="password" id="firstNewPassword" autocomplete="new-password">
          <span class="hint">8文字以上</span>
        </div>
        <div class="field">
          <label for="firstConfirmPassword">新しいパスワード（確認）</label>
          <input type="password" id="firstConfirmPassword" autocomplete="new-password">
        </div>
        <p id="firstPasswordError" class="login-error" role="alert"></p>
        <div class="login-actions">
          <button class="btn" id="firstPasswordSubmitBtn">変更して始める</button>
          <button class="btn quiet" id="firstPasswordCancelBtn">キャンセル</button>
        </div>
      </div>

    </div>
  </div>

  <script src="js/ollama.js"></script>
  <script src="js/safety.js"></script>
  <script src="js/password.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
